name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-memdrive-${{ github.event_name == 'push' && 'main' || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      environment: ${{ steps.mode.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select mode from the committed version and origin tags
        id: mode
        run: node scripts/select-release-mode.mjs

  publish:
    needs: mode
    runs-on: ubuntu-latest
    environment: ${{ needs.mode.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RUN_MODE: ${{ needs.mode.outputs.mode }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      # A rerun of a tagged stable release commit has no next dev build (N = 0).
      - name: Prepare automatic development version
        id: dev
        if: needs.mode.outputs.mode == 'dev'
        run: node scripts/prepare-dev-package.mjs
      - name: Validate channel, source commit and release metadata
        id: release
        if: steps.dev.outputs.ready != 'false'
        run: node scripts/check-publish.mjs
      - name: Verify publishing toolchain
        if: steps.dev.outputs.ready != 'false'
        run: |
          node --version
          npm --version
          node --input-type=module -e "import {execFileSync} from 'node:child_process'; const [major,minor,patch] = execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error('npm 11.5.1+ is required for Trusted Publishing');"
      - name: Install dependencies
        if: steps.dev.outputs.ready != 'false'
        run: npm ci
      - name: Lint and typecheck
        if: steps.dev.outputs.ready != 'false'
        run: |
          npm run lint
          npm run typecheck
      - name: Test
        if: steps.dev.outputs.ready != 'false'
        run: npm test
      - name: Validate exact archive and run deployed smoke tests
        if: steps.dev.outputs.ready != 'false'
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.release.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.release.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_API_KEY: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}
        run: npm run check:package -- --live --output-directory artifacts/release
      - name: Retain validated archive and manifest
        if: steps.dev.outputs.ready != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish tested archive through npm Trusted Publishing
        if: needs.mode.outputs.mode != 'verify' && steps.dev.outputs.ready != 'false'
        run: node scripts/publish-package.mjs artifacts/release/npm-pack.json
